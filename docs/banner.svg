<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="0.5" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#d29922"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#accent)"/>

  <text x="80" y="92" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="20" fill="#8b949e" letter-spacing="1">UNOFFICIAL · OPEN SOURCE · MIT</text>
  <text x="80" y="160" font-family="DejaVu Sans, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-weight="bold" font-size="62" fill="#f0f6fc">claude-code-profiles</text>

  <g font-family="DejaVu Sans, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="38" fill="#c9d1d9">
    <text x="80" y="262">One Claude Code account</text>
    <text x="80" y="310">per project, applied</text>
    <text x="80" y="358">automatically.</text>
  </g>

  <g font-family="DejaVu Sans, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-weight="bold" font-size="22">
    <rect x="80" y="410" width="112" height="46" rx="23" fill="#3fb950" fill-opacity="0.15" stroke="#3fb950"/>
    <text x="136" y="441" text-anchor="middle" fill="#3fb950">Team</text>
    <rect x="206" y="410" width="148" height="46" rx="23" fill="#d29922" fill-opacity="0.15" stroke="#d29922"/>
    <text x="280" y="441" text-anchor="middle" fill="#d29922">Personal</text>
    <rect x="368" y="410" width="164" height="46" rx="23" fill="#58a6ff" fill-opacity="0.15" stroke="#58a6ff"/>
    <text x="450" y="441" text-anchor="middle" fill="#58a6ff">Vertex AI</text>
  </g>

  <text x="80" y="560" font-family="DejaVu Sans, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e">Terminal + VS Code  ·  macOS &amp; Linux  ·  zero dependencies</text>

  <!-- terminal -->
  <g transform="translate(690,200)">
    <rect width="510" height="320" rx="14" fill="#010409" stroke="#30363d" stroke-width="2"/>
    <path d="M0 14 a14 14 0 0 1 14 -14 h482 a14 14 0 0 1 14 14 v26 h-510 z" fill="#161b22"/>
    <circle cx="26" cy="20" r="7" fill="#f85149"/>
    <circle cx="50" cy="20" r="7" fill="#d29922"/>
    <circle cx="74" cy="20" r="7" fill="#3fb950"/>
    <g font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="20">
      <text x="26" y="82" fill="#8b949e">~/work/client-app <tspan fill="#f0f6fc">$ claude</tspan></text>
      <text x="26" y="116" fill="#3fb950">● ccprof: team</text>
      <text x="26" y="172" fill="#8b949e">~/work/platform <tspan fill="#f0f6fc">$ claude</tspan></text>
      <text x="26" y="206" fill="#58a6ff">● ccprof: vertex · acme-billing</text>
      <text x="26" y="262" fill="#8b949e">~/personal/blog <tspan fill="#f0f6fc">$ claude</tspan></text>
      <text x="26" y="296" fill="#d29922">● ccprof: personal</text>
    </g>
  </g>
</svg>
