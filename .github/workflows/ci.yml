name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: bash version used by the scripts
        run: /bin/bash --version | head -n1
      - name: CLI tests
        run: /bin/bash tests/smoke.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: VS Code extension tests
        run: node vscode/test/run.js

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -s bash bin/ccprof bin/ccm shims/claude lib/ccprof-common.sh install.sh tests/smoke.sh
      - name: Versions in sync
        run: |
          cli=$(sed -n 's/^CCPROF_VERSION="\(.*\)"/\1/p' lib/ccprof-common.sh)
          ext=$(node -p "require('./vscode/package.json').version")
          echo "CLI $cli — extension $ext"
          test "$cli" = "$ext"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build extension (check)
        run: |
          cp LICENSE vscode/LICENSE
          cd vscode && npx --yes @vscode/vsce@latest package -o ../ccprof-vscode.vsix
